<header class="site-header">

  <nav class="main-nav" aria-label="Main navigation">

    <div class="language-switcher">
      <button class="language-button active" data-language="en" type="button">EN</button>

      <button class="language-button" data-language="ps" type="button">پښتو</button>

    <div class="command-head"><strong id="commandTitle" data-i18n="commandTitle">KBL Search</strong><span>ESC</span></div>

    <div class="command-links">
      <button type="button" data-command-action="search" data-i18n="commandSearch">Search properties</button>
      <button type="button" data-command-action="saved" data-i18n="saved">Saved</button>

  </div>
